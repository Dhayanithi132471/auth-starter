services:
  - type: web
    name: auth-starter
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auth-starter-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL_MINUTES
        value: "30"
      - key: JWT_ISSUER
        value: "auth-starter"
      - key: JWT_AUDIENCE
        value: "auth-starter-web"
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOWED_ORIGINS
        value: '["https://auth-starter.onrender.com"]'
      - key: PORT
        value: "10000"

  - type: pserv
    name: auth-starter-db
    runtime: docker
    plan: free
    dockerfilePath: ./database/Dockerfile
    dockerContext: .
